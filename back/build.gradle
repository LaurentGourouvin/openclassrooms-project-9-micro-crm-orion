plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'
	id 'jacoco'
	id "org.sonarqube" version "7.2.3.7755"
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

jacoco {
	toolVersion = "0.8.10"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
	finalizedBy jacocoTestReport
}

sonar {
	properties {
		property "sonar.projectKey", "LaurentGourouvin_openclassrooms-project-9-micro-crm-orion"
		property "sonar.organization", "laurentgourouvin"
		property "sonar.coverage.jacoco.xmlReportPaths",
				"build/reports/jacoco/test/jacocoTestReport.xml"
	}
}

task copyDependencies(type: Copy) {
	from configurations.runtimeClasspath
	into "$buildDir/dependencies"
}